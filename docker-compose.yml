services:
  wol-telegram-server:
    build: .
    container_name: wol-telegram-server
    restart: unless-stopped
    # במצב host פקטי ה-WOL (UDP Broadcast) נשלחים ישירות לרשת המקומית הפיזית
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
